<p>login works!</p>
<mat-card class="login-card">
    <h1>log in</h1>
    <mat-card-content>
        <div >
            <mat-form-field class="full-width">
              <mat-label>Email</mat-label>
              <input matInput type="email" [(ngModel)]="email">
            </mat-form-field>
            <mat-form-field class="full-width">
              <mat-label>Password</mat-label>
              <input matInput type="password" [(ngModel)]="password">
            </mat-form-field>
        </div>
        
    </mat-card-content>  
    <mat-card-actions>
        <button type="button" matButton (click)="doLogin()">
           <mat-icon fontIcon="login"/> Login
        </button>
    </mat-card-actions>
    

</mat-card>
